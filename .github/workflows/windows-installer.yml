name: Build and verify Windows observer installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
concurrency:
  group: blofin-observer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop obsolete observer builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          gh api "repos/$REPOSITORY/actions/workflows/windows-installer.yml/runs?per_page=30" > runs.json
          jq -r --argjson current "$CURRENT_RUN" '.workflow_runs[] | select(.id < $current and (.status == "queued" or .status == "in_progress")) | .id' runs.json > obsolete.txt
          while read -r run_id; do
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" || true
          done < obsolete.txt
  build:
    needs: supersede
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bundled CPU runtime and build tools
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-build.txt
      - name: Unit and architecture checks
        run: |
          python -m pytest -q
          python -m strategy_lab --self-test
      - name: Prepare genuine checkpoints and source manifest
        run: python scripts/prepare_models.py
      - name: Genuine models and desktop integration on synthetic fixtures
        run: |
          python -m strategy_lab --offline-model-smoke
          python -m strategy_lab --offline-desktop-smoke
      - name: Compile complete bundled application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name BloFinObserver --paths src --collect-all timesfm
          --collect-all exchange_calendars --collect-all pyluach --collect-all tzdata
          --collect-all model --collect-all huggingface_hub --collect-all einops --collect-all safetensors
          --copy-metadata timesfm --copy-metadata torch --copy-metadata huggingface_hub --copy-metadata safetensors
          --add-data "model-assets;model-assets" src/strategy_lab/__main__.py
      - name: Frozen app GUI and offline model validation
        shell: pwsh
        run: |
          $env:HF_HUB_OFFLINE = '1'
          foreach ($flag in @('--self-test', '--offline-model-smoke', '--offline-desktop-smoke')) {
            $process = Start-Process dist/BloFinObserver/BloFinObserver.exe -ArgumentList $flag -PassThru
            if (!$process.WaitForExit(180000)) { $process.Kill(); throw "Frozen test timed out: $flag" }
            if ($process.ExitCode -ne 0) { throw "Frozen test failed: $flag" }
          }
      - name: Compile conventional installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Build smaller updater retaining installed model weights
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-update | Out-Null
          Copy-Item dist/BloFinObserver dist-update/BloFinObserver -Recurse
          Remove-Item dist-update/BloFinObserver/_internal/model-assets -Recurse -Force
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DUpdateOnly=1 windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Updater compilation failed' }
      - name: Install, launch and exercise installed binary
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'BloFinInstalled'
          $p = Start-Process installer-output/BloFinObserver-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$install") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installation failed' }
          foreach ($flag in @('--self-test', '--offline-model-smoke', '--offline-desktop-smoke')) {
            $p = Start-Process "$install/BloFinObserver.exe" -ArgumentList $flag -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw "Installed test timed out: $flag" }
            if ($p.ExitCode -ne 0) { throw "Installed test failed: $flag" }
          }
          Get-FileHash installer-output/BloFinObserver-Setup.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - name: Apply updater to fresh baseline and verify retained models and journal
        shell: pwsh
        run: |
          $previous = Resolve-Path 'installer-output/BloFinObserver-Setup.exe'
          $upgrade = Join-Path $env:RUNNER_TEMP 'BloFinUpgradeTest'
          $p = Start-Process $previous -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$upgrade") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Baseline installation failed' }
          $model = Join-Path $upgrade '_internal/model-assets/timesfm/model.safetensors'
          $before = (Get-FileHash $model -Algorithm SHA256).Hash
          python -c "from strategy_lab.store import Store; from pathlib import Path; import os; s=Store(Path(os.environ['LOCALAPPDATA'])/'BloFinObserver'/'observer.sqlite3'); s.open_trade('Alyssa manual','BTC-USDT','long',1000,100,99,102,'Updater retention probe','manual',2); s.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed retention journal' }
          $journal = Join-Path $env:LOCALAPPDATA 'BloFinObserver/observer.sqlite3'
          $journalBefore = (Get-FileHash $journal -Algorithm SHA256).Hash
          $p = Start-Process installer-output/BloFinObserver-Update.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$upgrade") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Update installation failed' }
          if ((Get-FileHash $model -Algorithm SHA256).Hash -ne $before) { throw 'Updater modified model weights' }
          if ((Get-FileHash $journal -Algorithm SHA256).Hash -ne $journalBefore) { throw 'Updater modified journal' }
          $env:HF_HUB_OFFLINE = '1'
          foreach ($flag in @('--self-test','--offline-model-smoke','--offline-desktop-smoke')) {
            $p = Start-Process "$upgrade/BloFinObserver.exe" -ArgumentList $flag -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw "Upgraded test timed out: $flag" }
            if ($p.ExitCode -ne 0) { throw "Upgraded test failed: $flag" }
          }
          Get-FileHash installer-output/*.exe -Algorithm SHA256 | Format-List | Out-File installer-output/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BloFinObserver-Windows-Installer
          path: installer-output/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-Evidence
          path: |
            *-smoke.json
            startup-error.log
            model-assets/manifest.json
      - name: Publish tested installer as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "observer-${{ github.run_number }}"
          gh release create $tag installer-output/* --target '${{ github.sha }}' --prerelease --title "BloFin Observer build ${{ github.run_number }}" --notes 'Observer 0.3.3: new entries are flip-only, with an exact ETH-USDT plain Fibonacci SHORT exception retaining the original direction and levels. No paired originals are created. New Open positions tab/button shows ALL open positions including retained positions from prior versions. Earlier original history is hidden by default but available via checkbox. Original positions/history are not rewritten. Prior 0.3.2 behavior (superseded for new entries): paired direction-only [FLIP] paper comparison. Buy becomes short and sell becomes long, preserving original quantity, stop/target percentage distances and configured costs. Uses the opposite side of the same observed quote; does not swap stop/target distances or rerun model/OB gates for the flip. Original tracks and history retained. Prior 0.3.1 features: persistent entry outcomes and error history, bounded fresh-quote retry within the unchanged 90-second signal window, readable 12-hour decision history with Copy report. Historical missing outcomes remain unknown. Prior 0.3.0 features: dollar P/L per $100, independent experimental quality-v2 paper accounts and risk gates, SPY/QQQ data-key setup and session-aware integration. Windows Server 2022 unit, genuine offline-model, GUI, installed flip-ledger and updater-preservation checks passed using clearly labeled synthetic fixtures. Live crypto verification is separate in the Live-BloFin-Status artifact and can be blocked by the provider; no live-data pass is implied by this release. ETF live-feed acceptance is BLOCKED pending a user-configured Twelve Data key/entitlement; synthetic ETF input tests only verify model/calendar plumbing. No profitability claim. Windows 11 interactive and annotated SMC acceptance remain outstanding.'

  live-provider-status:
    needs: supersede
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent live BloFin verification
        shell: pwsh
        run: |
          python -c "from strategy_lab.network_probe import report_status; report_status()"
          if ($LASTEXITCODE -ne 0) { throw 'Live-status reporter failed' }
          Get-Content live-provider-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Live-BloFin-Status
          path: |
            live-provider-status.json
            network-smoke.json
          if-no-files-found: error
